name: SGCM CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  BUILD_CONFIGURATION: Release
  SOLUTION: SGCM.sln

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 54325:1025

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Instalar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore $SOLUTION

      - name: Compilar solucion
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIGURATION --no-restore

      - name: Ejecutar pruebas unitarias
        run: >
          dotnet test SGCM.Test/SGCM.Test.csproj
          --configuration $BUILD_CONFIGURATION
          --no-build
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- xUnit.ReporterSwitch=allure

      - name: Publicar resultados de pruebas
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Resultados de pruebas
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          use-actions-summary: 'true'

      - name: Unificar cobertura
        if: always()
        uses: danielpalme/reportgenerator-github-action@5f3701a41d14548c9b8e575a5c235230e515cbc0 # v5.6.0
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/CoverageReport
          reporttypes: Cobertura;HtmlInline

      - name: Resumen de cobertura
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/CoverageReport/Cobertura.xml
          format: markdown
          output: both

      - name: Agregar cobertura al resumen
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      # Allure.Xunit escribe en la carpeta de salida del proyecto de pruebas
      # (bin/Release/<tfm>/allure-results); se copia a una ruta fija.
      - name: Reunir resultados de Allure
        if: always()
        run: |
          mkdir -p allure-results
          dir=$(find SGCM.Test/bin -type d -name allure-results | head -n 1)
          if [ -n "$dir" ]; then cp -r "$dir"/. allure-results/; else echo "No se encontraron resultados de Allure"; fi

      - name: Subir resultados de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Subir reportes y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults

  allure-report:
    name: Publicar reporte Allure
    needs: build-and-test
    # Solo en push o ejecucion manual: la tendencia refleja la rama, no cada PR.
    if: always() && github.event_name != 'pull_request' && needs.build-and-test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - name: Descargar resultados de Allure
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # Se configura antes de generar el reporte porque su base_url se usa
      # para descargar el sitio publicado anteriormente.
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Respaldo para la primera publicacion con deploy-pages: el sitio previo
      # solo existe en la rama gh-pages. Si la rama no existe, el paso se omite.
      - name: Obtener historial de gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Allure
        run: npm install -g allure-commandline@2

      # deploy-pages reemplaza el sitio completo en cada despliegue, por eso se
      # restaura el sitio publicado (reportes de todas las ramas y su historial)
      # desde site.tar.gz antes de generar el reporte nuevo en <rama>/.
      - name: Generar reporte Allure
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SITE_ARCHIVE: site.tar.gz
        run: |
          mkdir -p site
          # El parametro evita recibir una copia vieja desde la cache del CDN de Pages.
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/$SITE_ARCHIVE" "$PAGES_URL/$SITE_ARCHIVE?run=$GITHUB_RUN_ID"; then
            tar -xzf "$RUNNER_TEMP/$SITE_ARCHIVE" -C site
          elif [ -d gh-pages ]; then
            cp -r gh-pages/. site/
            rm -rf site/.git
          else
            echo "No hay sitio previo; se genera el reporte sin historial"
          fi

          if [ -d "site/$BRANCH/history" ]; then
            cp -r "site/$BRANCH/history" allure-results/history
          fi

          cat > allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": $RUN_NUMBER,
            "buildName": "SGCM CI #$RUN_NUMBER",
            "buildUrl": "$RUN_URL",
            "reportName": "SGCM - $BRANCH"
          }
          JSON

          allure generate allure-results --clean -o "site/$BRANCH"

          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><title>Reportes de pruebas SGCM</title></head>
          <body>
            <h1>Reportes de pruebas SGCM</h1>
            <ul>
              <li><a href="dev/">dev</a></li>
              <li><a href="qa/">qa</a></li>
              <li><a href="main/">main</a></li>
            </ul>
          </body>
          </html>
          HTML

          # Copia del sitio completo que la siguiente ejecucion descarga para no
          # perder los reportes de las demas ramas.
          tar -czf "$RUNNER_TEMP/$SITE_ARCHIVE" -C site --exclude="./$SITE_ARCHIVE" .
          mv "$RUNNER_TEMP/$SITE_ARCHIVE" "site/$SITE_ARCHIVE"

      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4