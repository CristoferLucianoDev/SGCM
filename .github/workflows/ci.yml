name: SGCM CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  BUILD_CONFIGURATION: Release
  SOLUTION: SGCM.sln

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Instalar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore $SOLUTION

      - name: Compilar solucion
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIGURATION --no-restore

      - name: Ejecutar pruebas unitarias
        run: >
          dotnet test SGCM.Test/SGCM.Test.csproj
          --configuration $BUILD_CONFIGURATION
          --no-build
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Publicar resultados de pruebas
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados de pruebas
          path: TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Resumen de cobertura
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          format: markdown
          output: both

      - name: Agregar cobertura al resumen
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Subir reportes y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults