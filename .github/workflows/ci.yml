name: SGCM CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  BUILD_CONFIGURATION: Release
  SOLUTION: SGCM.sln

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 54325:1025

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Instalar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore $SOLUTION

      - name: Compilar solucion
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIGURATION --no-restore

      - name: Ejecutar pruebas unitarias
        run: >
          dotnet test SGCM.Test/SGCM.Test.csproj
          --configuration $BUILD_CONFIGURATION
          --no-build
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- xUnit.ReporterSwitch=allure

      - name: Publicar resultados de pruebas
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Resultados de pruebas
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          use-actions-summary: 'true'

      - name: Unificar cobertura
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/CoverageReport
          reporttypes: Cobertura;HtmlInline

      - name: Resumen de cobertura
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/CoverageReport/Cobertura.xml
          format: markdown
          output: both

      - name: Agregar cobertura al resumen
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      # Allure.Xunit escribe en la carpeta de salida del proyecto de pruebas
      # (bin/Release/<tfm>/allure-results); se copia a una ruta fija.
      - name: Reunir resultados de Allure
        if: always()
        run: |
          mkdir -p allure-results
          dir=$(find SGCM.Test/bin -type d -name allure-results | head -n 1)
          if [ -n "$dir" ]; then cp -r "$dir"/. allure-results/; else echo "No se encontraron resultados de Allure"; fi

      - name: Subir resultados de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Subir reportes y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults

  allure-report:
    name: Publicar reporte Allure
    needs: build-and-test
    # Solo en push o ejecucion manual: la tendencia refleja la rama, no cada PR.
    if: always() && github.event_name != 'pull_request' && needs.build-and-test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - name: Descargar resultados de Allure
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # Trae los reportes anteriores para conservar el historial (tendencia).
      # En el primer run la rama gh-pages no existe y el paso se omite.
      - name: Obtener historial
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Allure
        run: npm install -g allure-commandline@2

      # Copia el sitio actual, recupera el historial de la rama y genera el
      # reporte nuevo en <rama>/. El historial es lo que alimenta la tendencia.
      - name: Generar reporte Allure
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p site
          if [ -d gh-pages ]; then
            cp -r gh-pages/. site/
            rm -rf site/.git
          fi

          if [ -d "site/$BRANCH/history" ]; then
            cp -r "site/$BRANCH/history" allure-results/history
          fi

          cat > allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": $RUN_NUMBER,
            "buildName": "SGCM CI #$RUN_NUMBER",
            "buildUrl": "$RUN_URL",
            "reportName": "SGCM - $BRANCH"
          }
          JSON

          allure generate allure-results --clean -o "site/$BRANCH"

          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><title>Reportes de pruebas SGCM</title></head>
          <body>
            <h1>Reportes de pruebas SGCM</h1>
            <ul>
              <li><a href="dev/">dev</a></li>
              <li><a href="qa/">qa</a></li>
              <li><a href="main/">main</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
